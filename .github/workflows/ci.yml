# CI workflow for StrikeTraX.
# Runs the backend pytest suite + ruff, and the frontend Vitest suite.

name: StrikeTraX

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  backend:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Pytest
        run: uv run pytest
      
      - name: Run Ruff
        run: uv run ruff check .

  frontend:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm install
      
      - name: Run Vitest tests
        run: npm run test

